<!DOCTYPE html>
<html lang="ptbr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../static/styles/global.css" />
    <link rel="stylesheet" href="../static/styles/contact.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="../static/img/favicon.png" type="image/x-icon" />
    <title>AquaTerra - Soluções Térmicas Premium</title>
  </head>
  <body>
    {% extends "base.html" %}
    {% block main %}

    <section id="ribbon"></section>
    <section class="formwrapper">
      <div class="form-body">
        <div class="form-col">
          <form>
            <div class="title">Envie seu e-mail</div>
            <label class="form-input" for="fname">Email:</label><br />
            <input type="text" id="formName" name="formName" /><br />
            <label class="form-input" for="lname">Assunto:</label><br />
            <input type="text" id="formSubject" name="formSubject" /><br />
            <label class="form-input" for="lname">Descrição:</label><br />
            <input type="text" id="formDescription" name="formDescription" /><br />
            <input type="submit" value="Submit" class="submit"/>
          </form>
        </div>
        <div class="form-col">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d64270.79096570437!2d-46.62989777962501!3d-23.52599334614419!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94cef7d663fcd75f%3A0xd44c5da5a5eb8cbd!2sAeroporto%20do%20Campo%20de%20Marte!5e0!3m2!1spt-BR!2sbr!4v1787969062232!5m2!1spt-BR!2sbr"
            width="600"
            height="450"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>
        </div>
      </div>
    </section>
    
    {% endblock %}
  </body>
  <script src="../static/js/scripts.js" defer></script>
</html>
